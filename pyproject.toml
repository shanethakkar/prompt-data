[project]
name = "verity"
version = "0.1.0"
description = "Trust-layer natural-language-to-SQL analytics copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlglot>=25.0,<26",
    "psutil>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-psutil>=6.0",
]
data = [
    "pandas>=2.2",   # offline scripts only — never import in the server process
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["data/", "eval/", "frontend/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
