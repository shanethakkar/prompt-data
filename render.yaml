# Render blueprint for the Prompt Data backend. In the Render dashboard: New + > Blueprint,
# connect github.com/shanethakkar/prompt-data, then set the two sync:false secrets below.
services:
  - type: web
    name: prompt-data-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # bump to "starter" for always-on (no ~50s cold start)
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard (secret)
      - key: CORS_ORIGINS
        sync: false # set to the Vercel site URL, e.g. https://prompt-data.vercel.app
      - key: GENERATION_MODEL
        value: claude-sonnet-4-6
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: DAILY_REQUEST_CAP
        value: "500"
