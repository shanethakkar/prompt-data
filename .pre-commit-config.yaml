# Local hooks call the project's own ruff via uv, so the pre-commit hook and the
# `make lint` / CI gate always use the exact same ruff version (no drift between a
# pinned mirror and the pinned dev dependency).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
